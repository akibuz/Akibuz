          </div>
        </div>
      </div>
      <div class="signature-quote">${t("about_signature")}</div>
    `;
    document.getElementById("mainContent").innerHTML = html;

    // Accordion logic
    document.querySelectorAll(".accordion-trigger").forEach(btn => {
      btn.addEventListener("click", () => {
        const body = btn.nextElementSibling;
        const isOpen = body.classList.contains("open");
        // close all
        document.querySelectorAll(".accordion-body").forEach(b => b.classList.remove("open"));
        document.querySelectorAll(".accordion-trigger").forEach(b => b.setAttribute("aria-expanded","false"));
        // open clicked if it was closed
        if (!isOpen) {
          body.classList.add("open");
          btn.setAttribute("aria-expanded","true");
        }
      });
    });
  }

      <h1 class="page-title">${t("contact_title")}</h1>
      <div class="contact-wrapper">
        <div class="contact-info">
          <h3>${t("contact_title")}</h3>
          <p>${t("contact_info_text")}</p>
          <div class="contact-detail"><strong>${t("contact_email_label")}:</strong> akibuz@proton.me</div>
          <div class="contact-detail"><strong>${t("contact_studio_label")}:</strong> ${t("contact_studio_val")}</div>
          <div class="contact-detail">
            <strong>${t("contact_instagram")}:</strong> 
            <a href="https://www.instagram.com/akibuz.ceramics" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; gap:6px; color:#111111; text-decoration:none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="#E4405F" stroke-width="2" fill="none"/>
                <circle cx="12" cy="12" r="4" stroke="#E4405F" stroke-width="2" fill="none"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="#E4405F"/>
              </svg>
              @akibuz.ceramics
            </a>
          </div>
          <div class="contact-detail"><strong>${t("contact_news")}:</strong> ${t("contact_news_text")}</div>
          <div style="margin-top:1.5rem;"><img src="${studioImage}" style="width:100%; border-radius:28px;" alt="Studio"></div>
        </div>
        <div class="contact-form">
          <h3>${t("contact_form_title")}</h3>
          <form id="contactFormElement">
            <div class="form-group"><label>${t("contact_name")}</label><input type="text" id="contactName" name="name" required></div>
            <div class="form-group"><label>${t("contact_email")}</label><input type="email" id="contactEmail" name="email" required></div>
            <div class="form-group"><label>${t("contact_message")}</label><textarea id="contactMessage" name="message" rows="4" required></textarea></div>
            <input type="hidden" name="_language" id="formLang" value="${currentLang}">
            <button type="submit" class="btn" id="contactSubmitBtn">${t("contact_submit")}</button>
            <p id="formFeedback" style="font-size:0.85rem; margin-top:0.8rem; min-height:1.2em;"></p>
          </form>
        </div>
      </div>
    `;
    document.getElementById("mainContent").innerHTML = html;
    const form = document.getElementById("contactFormElement");
    if(form) form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("contactSubmitBtn");
      const feedback = document.getElementById("formFeedback");
      btn.disabled = true;
      btn.style.opacity = "0.6";
      feedback.style.color = "inherit";
      feedback.textContent = currentLang === 'eus' ? 'Bidaltzen...' : currentLang === 'es' ? 'Enviando...' : 'Sending...';
      try {
        const res = await fetch("https://formspree.io/f/mdabrboa", {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form)
        });
        if (res.ok) {
          feedback.style.color = "#5a8a5a";
          feedback.textContent = currentLang === 'eus' ? '✓ Mezua bidali da. Eskerrik asko!' : currentLang === 'es' ? '✓ Mensaje enviado. ¡Gracias!' : '✓ Message sent. Thank you!';
          form.reset();
        } else {
          throw new Error("server error");
        }
      } catch {
        feedback.style.color = "#a05050";
        feedback.textContent = currentLang === 'eus' ? 'Errorea. Saiatu berriro edo idatzi akibuz@proton.me' : currentLang === 'es' ? 'Error al enviar. Prueba de nuevo o escribe a akibuz@proton.me' : 'Could not send. Please try again or email akibuz@proton.me';
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    });
}

  function loadPage(page) {
    currentPage = page;
    if(page === "about") renderAboutPage();
    else if(page === "catalogue") renderCataloguePage();
    else if(page === "services") renderServicesPage();
    else if(page === "truke") renderTrukePage();
    else if(page === "contact") renderContactPage();
    document.querySelectorAll("#navLinks a[data-page]").forEach(link => {
      if(link.getAttribute("data-page") === page) link.classList.add("active");
      else link.classList.remove("active");
    });
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function updateUIBasedOnLanguage() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if(translations[key] && translations[key][currentLang]) {
        el.innerText = translations[key][currentLang];
      }
    });
    if(currentPage === "about") renderAboutPage();
    else if(currentPage === "catalogue") renderCataloguePage();
    else if(currentPage === "services") renderServicesPage();
    else if(currentPage === "truke") renderTrukePage();
    else if(currentPage === "contact") renderContactPage();
    
    document.querySelectorAll(".lang-btn").forEach(btn => {
      if(btn.getAttribute("data-lang") === currentLang) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  // Event listeners
  document.addEventListener("click", (e) => {
    const link = e.target.closest("#navLinks a[data-page]");
    if(link) { e.preventDefault(); loadPage(link.getAttribute("data-page")); }
    const logo = e.target.closest("#logoLink");
    if(logo) { e.preventDefault(); loadPage("about"); }
    const langBtn = e.target.closest(".lang-btn");
    if(langBtn) { 
      currentLang = langBtn.getAttribute("data-lang"); 
      updateUIBasedOnLanguage(); 
    }
  });
  
  // Initialize
  loadPage("about");

  // Hamburger menu toggle
  const menuToggle = document.getElementById("menuToggle");
  const navLinks   = document.getElementById("navLinks");
  const iconMenu   = document.getElementById("iconMenu");
  const iconClose  = document.getElementById("iconClose");

  menuToggle.addEventListener("click", () => {
    const isOpen = navLinks.classList.toggle("open");
    menuToggle.setAttribute("aria-expanded", isOpen);
    iconMenu.style.display  = isOpen ? "none"  : "block";
    iconClose.style.display = isOpen ? "block" : "none";
  });

  // Close menu when a nav link is clicked
  navLinks.addEventListener("click", (e) => {
    if (e.target.closest("a")) {
      navLinks.classList.remove("open");
      menuToggle.setAttribute("aria-expanded", "false");
      iconMenu.style.display  = "block";
      iconClose.style.display = "none";
    }
  });

  // Close menu on outside click
  document.addEventListener("click", (e) => {
    if (!menuToggle.contains(e.target) && !navLinks.contains(e.target)) {
      navLinks.classList.remove("open");
      menuToggle.setAttribute("aria-expanded", "false");
      iconMenu.style.display  = "block";
      iconClose.style.display = "none";
    }
  });
</script>
</body>
</html>
