      font-weight: 400;
      font-size: 1rem;
    }

    }

      margin: 0 auto;
      padding: 0 1.8rem;
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;

      align-items: center;

    }

      height: 48px;
      background: #dccfbf;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 500;
      color: #4f3f32;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .logo-img:hover {
      transform: scale(1.02);
    }
    .logo-img img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .logo-text a {
      font-size: 1.5rem;
      font-weight: 450;
      letter-spacing: -0.3px;
      text-decoration: none;
      color: #2c2a29;
      transition: opacity 0.2s;

      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;

      color: #5a534c;
      font-size: 0.95rem;
      transition: color 0.2s;
      font-weight: 450;

      border-bottom: 1px solid #cbc1b6;
      padding-bottom: 2px;
    }

      background-color: #e8dfd7;
      color: #4a3f36 !important;
      padding: 0.35rem 1rem !important;
      border-radius: 40px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
      border-bottom: none !important;
    }
    .etsy-link:hover {
      background-color: #d9cec3;
      transform: translateY(-1px);
      border-bottom: none !important;
      color: #2c2a29 !important;
    }

      display: flex;
      gap: 0.6rem;
      margin-left: 0.5rem;
      border-left: 1px solid #ddd2c6;
      padding-left: 1rem;
    }

    .lang-btn {
      background: none;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      color: #8b7a6b;
      padding: 0.2rem 0.4rem;
      border-radius: 20px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .lang-btn.active {
      background: #e7ddd2;
      color: #2c2a29;
    }

    .lang-btn:hover {
      color: #2c2a29;
    }

      margin: 2rem 0 0.8rem;
      letter-spacing: -0.02em;
      color: #2f2c29;

      color: #3e3a36;
      border-left: 2px solid #ddd2c6;

      text-align: center;

      margin-top: 0.5rem;

      padding-top: 1.5rem;

      font-size: 1rem;
      color: #6b625a;

      background: #e9e0d6;

      margin: 2rem 0 4rem;

      font-size: 0.85rem;
      font-weight: 480;

      background: white;
      font-family: inherit;

      { nameKey:"cat_item6", descKey:"cat_desc6", img:ceramicImages[5] },
      { nameKey:"cat_item7", descKey:"cat_desc7", img:ceramicImages[6] },
      { nameKey:"cat_item8", descKey:"cat_desc8", img:ceramicImages[7] }
    ];
    let cards = `<div class="catalogue-grid">`;
    items.forEach(i => { 
      cards += `<div class="ceramic-card">
        <img class="card-img" src="${i.img}" alt="${t(i.nameKey)}" onerror="this.src='https://placehold.co/400x400/e9e0d6/8b7a6b?text=Imagen+no+encontrada'">
        <div class="card-info">
          <h3>${t(i.nameKey)}</h3>
          <p>${t(i.descKey)}</p>
        </div>
      </div>`; 
    });
    cards += `</div>`;
    document.getElementById("mainContent").innerHTML = `
      <h1 class="page-title">${t("catalogue_title")}</h1>
      <p style="margin-bottom:0.5rem; color:#5e5248;">${t("catalogue_sub")}</p>
      ${cards}
    `;
  }

  function loadPage(page) {
    currentPage = page;
    if(page === "about") renderAboutPage();
    else if(page === "catalogue") renderCataloguePage();
    else if(page === "contact") renderContactPage();
    document.querySelectorAll("#navLinks a[data-page]").forEach(link => {
      if(link.getAttribute("data-page") === page) link.classList.add("active");
      else link.classList.remove("active");
    });
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function updateUIBasedOnLanguage() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if(translations[key] && translations[key][currentLang]) {
        el.innerText = translations[key][currentLang];
      }
    });
    if(currentPage === "about") renderAboutPage();
    else if(currentPage === "catalogue") renderCataloguePage();
    else if(currentPage === "contact") renderContactPage();
    
    document.querySelectorAll(".lang-btn").forEach(btn => {
      if(btn.getAttribute("data-lang") === currentLang) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  // Event listeners
  document.addEventListener("click", (e) => {
    const link = e.target.closest("#navLinks a[data-page]");
    if(link) { e.preventDefault(); loadPage(link.getAttribute("data-page")); }
    const logo = e.target.closest("#logoLink");
    if(logo) { e.preventDefault(); loadPage("about"); }
    const langBtn = e.target.closest(".lang-btn");
    if(langBtn) { 
      currentLang = langBtn.getAttribute("data-lang"); 
      updateUIBasedOnLanguage(); 
    }
  });
  
  // Initialize
  loadPage("about");
</script>
